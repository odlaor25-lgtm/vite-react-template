<!DOCTYPE html>
<html lang="th" data-theme="glass">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>S.W.BERNHARDT — พนักงาน</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
[data-theme="glass"]{
  --bg-body:linear-gradient(160deg,#e8f4ff 0%,#f0eeff 35%,#e4f8ff 70%,#eef8f0 100%);
  --bg-card:rgba(255,255,255,0.62);--bg-card2:rgba(240,248,255,0.50);
  --bg-card3:rgba(230,244,255,0.38);--bg-input:rgba(248,252,255,0.78);
  --blur:blur(22px);--border-color:rgba(200,230,255,0.70);--border-inner:rgba(180,210,240,0.45);
  --shadow:0 4px 24px rgba(80,120,200,.07),0 1px 6px rgba(100,150,220,.04);
  --shadow-md:0 8px 40px rgba(80,120,200,.11);--shadow-btn:0 4px 14px rgba(99,102,241,.25);
  --text:#1a2240;--text2:#4a5a8a;--text3:#8a9ac0;
  --green:#0ea472;--green-lt:rgba(14,164,114,.1);--green-dk:#0c8a5e;
  --amber:#7c3aed;--amber-lt:rgba(124,58,237,.10);--amber-dk:#6d28d9;
  --blue:#6366f1;--blue-lt:rgba(99,102,241,.12);--blue-dk:#4f46e5;
  --teal:#0891b2;--teal-lt:rgba(8,145,178,.10);
  --red:#dc2626;--red-lt:rgba(220,38,38,.08);
  --topbar:rgba(240,248,255,.90);--mode-icon:🌙;
  --accent:var(--blue);
}
[data-theme="dark"]{
  --bg-body:linear-gradient(160deg,#060810 0%,#0a0c18 40%,#060d14 100%);
  --bg-card:rgba(10,14,30,.88);--bg-card2:rgba(14,20,40,.78);
  --bg-card3:rgba(18,26,50,.68);--bg-input:rgba(12,18,36,.85);
  --blur:blur(22px);--border-color:rgba(60,80,140,.70);--border-inner:rgba(50,70,120,.55);
  --shadow:0 4px 24px rgba(0,0,0,.40),0 1px 6px rgba(0,0,0,.30);
  --shadow-md:0 8px 40px rgba(0,0,0,.50);--shadow-btn:0 4px 14px rgba(99,102,241,.25);
  --text:#c8d8f8;--text2:#5a7aaa;--text3:#3a5070;
  --green:#34d399;--green-lt:rgba(52,211,153,.12);--green-dk:#10b981;
  --amber:#a78bfa;--amber-lt:rgba(167,139,250,.14);--amber-dk:#8b5cf6;
  --blue:#818cf8;--blue-lt:rgba(129,140,248,.12);--blue-dk:#6366f1;
  --teal:#22d3ee;--teal-lt:rgba(34,211,238,.12);
  --red:#f87171;--red-lt:rgba(248,113,113,.10);
  --topbar:rgba(6,8,20,.92);--mode-icon:☀️;
  --accent:var(--blue);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;font-family:'Sarabun',sans-serif;color:var(--text);font-size:15px;line-height:1.6}
body{background:var(--bg-body)}
body::before{content:'';position:fixed;inset:0;background:var(--bg-body);z-index:-1;transition:background .4s}
.glass{background:var(--bg-card);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--border-color);box-shadow:var(--shadow)}
.glass2{background:var(--bg-card2);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--border-inner)}
.glass3{background:var(--bg-card3);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--border-inner)}
/* LOGIN */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1.5rem;flex-direction:column;gap:14px}
.login-card{width:100%;max-width:380px;border-radius:20px;padding:2.5rem 2rem}
.login-logo{text-align:center;margin-bottom:2rem}
.login-logo span{font-size:46px;display:block;margin-bottom:10px;filter:drop-shadow(0 4px 10px rgba(217,119,6,.3))}
.login-logo h1{font-size:22px;font-weight:700;letter-spacing:.08em;color:var(--blue)}
.login-logo p{font-size:12px;color:var(--text3);margin-top:4px}
.autologin{background:var(--blue-lt);border:1.5px solid var(--blue);border-radius:12px;padding:1rem;display:flex;align-items:center;gap:12px;cursor:pointer;margin-bottom:14px;transition:all .15s}
.autologin:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(99,102,241,.2)}
.al-av{width:44px;height:44px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex-shrink:0}
.al-info .name{font-size:14px;font-weight:600;color:var(--text)}
.al-info .sub{font-size:11px;color:var(--text3)}
.al-arrow{margin-left:auto;font-size:18px;color:var(--blue)}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.fld label{font-size:11px;color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.fld input,.fld select{background:var(--bg-input);backdrop-filter:blur(8px);border:1.5px solid var(--border-inner);border-radius:10px;padding:0 14px;height:46px;font-size:15px;color:var(--text);outline:none;font-family:'Sarabun',sans-serif;transition:all .2s;width:100%}
.fld input:focus,.fld select:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-lt)}
.fld input::placeholder{color:var(--text3)}
.remember-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;cursor:pointer;user-select:none}
.remember-row input{width:16px;height:16px;accent-color:var(--blue);cursor:pointer}
.remember-row span{font-size:13px;color:var(--text2)}
.login-btn{width:100%;height:50px;background:linear-gradient(135deg,var(--blue) 0%,var(--blue-dk) 100%);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:'Sarabun',sans-serif;transition:all .2s;box-shadow:var(--shadow-btn)}
.login-btn:hover{filter:brightness(1.1);transform:translateY(-2px);box-shadow:0 8px 24px rgba(99,102,241,.35)}
.login-err{font-size:12px;color:var(--red);text-align:center;margin-top:6px;min-height:16px}
.login-note{font-size:11px;color:var(--text3);text-align:center;padding-top:10px;border-top:1px solid var(--border-inner);margin-top:6px}
/* APP */
#emp-app{display:none;flex-direction:column;min-height:100vh}
#emp-app.show{display:flex}
.topbar{position:sticky;top:0;z-index:100;height:56px;background:var(--topbar);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid var(--border-color);display:flex;align-items:center;padding:0 1.25rem;gap:10px}
.tb-brand{font-size:14px;font-weight:700;letter-spacing:.1em;color:var(--blue)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.tb-av{width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;box-shadow:0 2px 8px var(--blue-lt)}
.icon-btn{width:34px;height:34px;border-radius:50%;background:var(--bg-card2);backdrop-filter:blur(8px);border:1px solid var(--border-inner);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;transition:all .15s}
.icon-btn:hover{transform:scale(1.1)}
.logout-link{padding:5px 12px;border-radius:6px;background:transparent;border:1.5px solid var(--border-inner);color:var(--text3);font-size:11px;cursor:pointer;font-family:'Sarabun',sans-serif;transition:all .15s}
.logout-link:hover{border-color:var(--red);color:var(--red);background:var(--red-lt)}
.main{padding:1.25rem 1rem 2rem;max-width:820px;margin:0 auto;width:100%;flex:1}
/* HERO */
.hero{background:linear-gradient(135deg,rgba(255,255,255,.68) 0%,rgba(232,240,255,.60) 50%,rgba(238,232,255,.55) 100%);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--border-color);border-radius:20px;padding:1.5rem;margin-bottom:1.25rem;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;right:-10px;bottom:-20px;font-size:90px;opacity:.06;pointer-events:none}
.hero-greet{font-size:13px;color:var(--text3);font-weight:500;margin-bottom:2px}
.hero-name{font-size:22px;font-weight:700;color:var(--text);margin-bottom:4px}
.hero-sub{font-size:12px;color:var(--text3)}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:1.1rem}
.hst{background:var(--bg-card2);backdrop-filter:blur(8px);border:1px solid var(--border-inner);border-radius:12px;padding:.85rem .9rem;transition:all .2s}
.hst:hover{transform:translateY(-2px)}
.hst .hl{font-size:10px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.hst .hv{font-size:16px;font-weight:700;font-family:'IBM Plex Mono',monospace}
.hst .hv.a{color:var(--blue)}.hst .hv.g{color:var(--green)}.hst .hv.b{color:var(--teal)}
/* SECTION TITLE */
.sec-t{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:.75rem;display:flex;align-items:center;gap:8px}
.sec-t::after{content:'';flex:1;height:1px;background:var(--border-inner)}
/* FILTER TABS */
.filter-tabs{display:flex;gap:6px;margin-bottom:1rem;flex-wrap:wrap}
.ftab{padding:6px 16px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;background:var(--bg-card2);border:1.5px solid var(--border-inner);color:var(--text2);transition:all .15s;font-family:'Sarabun',sans-serif}
.ftab.active{background:var(--blue-lt);border-color:var(--blue);color:var(--blue-dk)}
.ftab:hover:not(.active){background:var(--bg-card)}
/* WAGE CARD */
.wage-list{display:flex;flex-direction:column;gap:8px}
.wage-card{background:var(--bg-card);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--border-color);border-radius:14px;padding:1rem 1.1rem;box-shadow:var(--shadow);transition:all .2s;display:flex;align-items:center;gap:12px}
.wage-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.wage-icon{width:40px;height:40px;background:var(--blue-lt);border:1.5px solid var(--blue);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.wage-date{font-size:12px;font-weight:600;color:var(--text)}
.wage-dept{font-size:11px;color:var(--text3);margin-top:1px}
.wage-note{font-size:11px;color:var(--text3);margin-top:2px;font-style:italic}
.wage-amount{font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:700;color:var(--blue)}
.wage-qty{font-size:11px;color:var(--text3);text-align:right;margin-top:2px}
/* MONTHLY SUMMARY */
.month-summary{display:flex;flex-direction:column;gap:6px;margin-bottom:1.25rem}
.month-item{background:var(--bg-card);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--border-color);border-radius:12px;padding:.9rem 1.1rem;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.month-label{font-size:13px;font-weight:600;flex:1}
.month-count{font-size:11px;color:var(--text3);min-width:60px}
.month-amount{font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:700;color:var(--blue)}
/* PRINT */
.wage-print{background:#fff;color:#1a1a1a;font-family:'Sarabun',sans-serif;font-size:13px;line-height:1.7;padding:2rem;display:none}
.wage-print h1{font-size:22px;font-weight:800;color:#3730a3;text-align:center;letter-spacing:.08em}
.wage-print h2{font-size:13px;text-align:center;color:#4f46e5;margin-bottom:14px}
.wt{width:100%;border-collapse:collapse;margin:12px 0;font-size:12px}
.wt th{background:#eef2ff;color:#3730a3;font-weight:700;padding:7px 10px;border:1px solid #c7d2fe;text-align:center}
.wt td{padding:7px 10px;border:1px solid #e0e7ff;text-align:right}
.wt td.lft{text-align:left}
.wt tr:nth-child(even) td{background:#f5f7ff}
.wt-total td{background:#e0e7ff;font-weight:700;border-top:2px solid #4f46e5}
.wt-foot{margin-top:10px;font-size:11px;color:#888;text-align:center;border-top:1px solid #ddd;padding-top:8px}
@media print{
  body,body::before{background:#fff!important}
  #login-screen,#emp-app,.detail-sheet{display:none!important}
  .wage-print{display:block!important;padding:0}
}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px}
.bg{background:rgba(22,160,106,.1);color:#0d7a50}.bb{background:rgba(37,99,235,.1);color:#1d4ed8}
.ba{background:rgba(217,119,6,.12);color:#92400e}.br{background:rgba(220,38,38,.1);color:#991b1b}
.bgr{background:var(--bg-card3);color:var(--text2)}
.empty{text-align:center;padding:3rem;color:var(--text3);font-size:13px}
.empty-icon{font-size:48px;margin-bottom:12px;opacity:.5;display:block}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card glass">
    <div class="login-logo">
      <span></span>
      <h1>S.W.BERNHARDT</h1>
      <p>Employee Portal — ตรวจสอบค่าแรงของคุณ</p>
    </div>

    <div id="al-wrap" style="display:none" onclick="autoLogin()">
      <div class="autologin">
        <div class="al-av" id="al-av">?</div>
        <div class="al-info">
          <div class="name" id="al-name">—</div>
          <div class="sub">แตะเพื่อเข้าสู่ระบบทันที</div>
        </div>
        <div class="al-arrow">›</div>
      </div>
    </div>

    <div class="fld">
      <label>ชื่อพนักงาน (ตรงกับในระบบ)</label>
      <input type="text" id="e-name" placeholder="เช่น สมชาย ขยันดี" autocomplete="name">
    </div>
    <div class="fld">
      <label>PIN (4 หลักท้ายเบอร์มือถือ)</label>
      <input type="password" id="e-pin" placeholder="••••" maxlength="4" inputmode="numeric" onkeydown="if(event.key==='Enter')doLogin()">
    </div>

    <label class="remember-row">
      <input type="checkbox" id="e-remember" checked>
      <span>จดจำฉันในอุปกรณ์นี้</span>
    </label>

    <button class="login-btn" onclick="doLogin()">ดูค่าแรง ›</button>
    <div class="login-err" id="e-err"></div>
    <div class="login-note">ติดต่อหัวหน้า หากยังไม่มีข้อมูลในระบบ<br>PIN = 4 หลักท้ายเบอร์มือถือที่ลงทะเบียน</div>
  </div>
  <div style="font-size:11px;color:var(--text3)">Demo: สมชาย ขยันดี / PIN 1111</div>
</div>

<!-- APP -->
<div id="emp-app">
  <div class="topbar">
    <div class="tb-brand">SWB พนักงาน</div>
    <div class="tb-right">
      <div class="tb-av" id="tb-av">S</div>
      <div class="icon-btn" onclick="toggleTheme()" id="theme-btn">🌙</div>
      <button class="logout-link" onclick="doLogout()">ออก</button>
    </div>
  </div>

  <div class="main">

    <!-- HERO -->
    <div class="hero">
      <div class="hero-greet" id="h-greet">ยินดีต้อนรับ</div>
      <div class="hero-name" id="h-name">—</div>
      <div class="hero-sub" id="h-sub">—</div>
      <div class="hero-stats" id="h-stats"></div>
    </div>

    <!-- MONTHLY SUMMARY -->
    <div class="sec-t">สรุปรายเดือน</div>
    <div class="month-summary" id="month-summary"></div>

    <!-- FILTER + LIST -->
    <div class="sec-t">รายการค่าแรงทั้งหมด</div>
    <div class="filter-tabs" id="filter-tabs">
      <button class="ftab active" onclick="filterWages('',this)">ทั้งหมด</button>
    </div>
    <div class="wage-list" id="wage-list"></div>

    <!-- PRINT BTN -->
    <div style="margin-top:1.5rem;display:flex;gap:8px">
      <button onclick="printWages()" style="flex:1;height:50px;background:linear-gradient(135deg,#6366f1,#4f46e5);color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Sarabun',sans-serif;box-shadow:var(--shadow-btn);transition:all .2s" onmouseover="this.style.filter='brightness(1.1)';this.style.transform='translateY(-1px)'" onmouseout="this.style.filter='none';this.style.transform='none'">🖨 พิมพ์สรุปค่าแรง / บันทึก PDF</button>
    </div>

  </div>
</div>

<!-- PRINT TEMPLATE -->
<div class="wage-print" id="print-wrap">
  <div id="print-content"></div>
</div>

<script>
const TOKEN={
  get:()=>localStorage.getItem('swb_emp_token'),
  set:(t)=>localStorage.setItem('swb_emp_token',t),
  clear:()=>localStorage.removeItem('swb_emp_token')
};
async function api(path,options={}){
  const t=TOKEN.get();
  const res=await fetch(path,{
    ...options,
    headers:{'Content-Type':'application/json',...(t?{Authorization:'Bearer '+t}:{})},
    body:options.body?JSON.stringify(options.body):undefined
  });
  if(!res.ok) throw new Error(await res.text());
  return res.json();
}
const $=id=>document.getElementById(id);
function fmt(n,d=2){return parseFloat(n||0).toLocaleString('th-TH',{minimumFractionDigits:d,maximumFractionDigits:d})}
function fmtD(s){if(!s)return'—';const d=new Date(s);const m=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];return String(d.getDate())+' '+m[d.getMonth()]+' '+(d.getFullYear()+543)}
function fmtDFull(s){if(!s)return'—';const d=new Date(s);const m=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];return String(d.getDate()).padStart(2,'0')+' '+m[d.getMonth()]+' '+(d.getFullYear()+543)}
function greeting(){const h=new Date().getHours();return h<12?'อรุณสวัสดิ์ 🌅':h<17?'สวัสดีตอนบ่าย ☀️':'สวัสดีตอนเย็น 🌆'}

const DEPT_ICONS={'สางใบ':'','ตัดอ้อย':'','โหลดอ้อย':'','ขนส่ง':''};
const DEPT_CLS={'สางใบ':'bg','ตัดอ้อย':'bb','โหลดอ้อย':'ba','ขนส่ง':'br'};

let currentName=null;
let currentFilter='';

/* THEME */
function setTheme(t){document.documentElement.setAttribute('data-theme',t);localStorage.setItem('swb_emp_theme',t);$('theme-btn').textContent=t==='dark'?'☀️':'🌙'}
function toggleTheme(){setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'glass':'dark')}
(function(){setTheme(localStorage.getItem('swb_emp_theme')||'glass');})();

/* AUTH */
function doLogin(){
  const name=$('e-name').value.trim();
  const pin=$('e-pin').value.trim();
  if(!name||!pin){$('e-err').textContent='กรุณากรอกชื่อและ PIN';return}
  const wages=DB.get('wages',[]);
  const exists=wages.some(w=>w.name===name);
  if(!exists){$('e-err').textContent='ไม่พบชื่อนี้ในระบบ กรุณาติดต่อหัวหน้า';return}
  const savedPin=DB.get('emp_pin_'+name.replace(/\s/g,'_'),'1111');
  if(pin!==savedPin&&pin!=='1111'){$('e-err').textContent='PIN ไม่ถูกต้อง';return}
  currentName=name;
  if($('e-remember').checked)DB.set('emp_saved_name',name);
  $('login-screen').style.display='none';$('emp-app').classList.add('show');
  renderApp();
}
async function autoLogin(){
  const name=localStorage.getItem('swb_emp_name');if(!name)return;
  try{
    const r=await api('/api/auth/employee',{method:'POST',body:{name,pin:'auto'}});
    TOKEN.set(r.token);currentName=r.name;
    $('login-screen').style.display='none';$('emp-app').classList.add('show');renderApp();
  }catch{localStorage.removeItem('swb_emp_name');}
}
function doLogout(){
  currentName=null;currentFilter='';
  $('emp-app').classList.remove('show');$('login-screen').style.display='';
  $('e-pin').value='';$('e-err').textContent='';checkAutoLogin();
}
function checkAutoLogin(){
  const name=localStorage.getItem('swb_emp_name');
  if(name){$('al-wrap').style.display='block';$('al-av').textContent=name.charAt(0);$('al-name').textContent=name}
  else $('al-wrap').style.display='none';
}

/* APP */
function renderApp(){
  /* ── ดึงเฉพาะของพนักงานคนนี้เท่านั้น ── */
  const myWages=DB.get('wages',[]).filter(w=>w.name===currentName);

  $('tb-av').textContent=currentName.charAt(0);
  $('h-greet').textContent=greeting();
  $('h-name').textContent=currentName;

  const myDepts=[...new Set(myWages.map(w=>w.dept))];
  $('h-sub').textContent='แผนก: '+(myDepts.join(', ')||'—')+' | '+myWages.length+' รายการ';

  const total=myWages.reduce((a,w)=>a+parseFloat(w.amount||0),0);
  const now=new Date(),mm=now.getMonth(),yy=now.getFullYear();
  const mWages=myWages.filter(w=>{if(!w.date)return false;const d=new Date(w.date);return d.getMonth()===mm&&d.getFullYear()===yy});
  const mTotal=mWages.reduce((a,w)=>a+parseFloat(w.amount||0),0);

  $('h-stats').innerHTML=
    hs(' ค่าแรงรวม',fmt(total)+' ฿','a')+
    hs(' เดือนนี้',fmt(mTotal)+' ฿','g')+
    hs(' รายการ',myWages.length+' รายการ','b');

  /* สรุปรายเดือน */
  const byMonth={};
  myWages.forEach(w=>{
    const mo=w.date?w.date.substring(0,7):'—';
    if(!byMonth[mo])byMonth[mo]={total:0,count:0};
    byMonth[mo].total+=parseFloat(w.amount||0);byMonth[mo].count++;
  });
  const months=Object.keys(byMonth).sort().reverse();
  $('month-summary').innerHTML=months.length
    ?months.map(mo=>'<div class="month-item glass2">'+
        '<div style="font-size:18px"></div>'+
        '<div class="month-label">'+mo+'</div>'+
        '<div class="month-count">'+byMonth[mo].count+' รายการ</div>'+
        '<div class="month-amount">'+fmt(byMonth[mo].total)+'</div>'+
      '</div>').join('')
    :'<div class="empty"><span class="empty-icon"></span><p>ยังไม่มีข้อมูล</p></div>';

  /* สร้าง filter tabs จากแผนกที่พนักงานคนนี้มีจริงๆ เท่านั้น */
  const tabs='<button class="ftab active" onclick="filterWages(\'\',this)">ทั้งหมด</button>'+
    myDepts.map(d=>'<button class="ftab" onclick="filterWages(\''+d+'\',this)">'+(DEPT_ICONS[d]||'💼')+' '+d+'</button>').join('');
  $('filter-tabs').innerHTML=tabs;

  currentFilter='';
  renderWageList(myWages);
}
function hs(l,v,c){return '<div class="hst"><div class="hl">'+l+'</div><div class="hv '+c+'">'+v+'</div></div>'}

function filterWages(dept,btn){
  currentFilter=dept;
  document.querySelectorAll('.ftab').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  /* ดึงเฉพาะของพนักงานคนนี้ แล้วค่อยกรองแผนก */
  const myWages=DB.get('wages',[]).filter(w=>w.name===currentName&&(!dept||w.dept===dept));
  renderWageList(myWages);
}

function renderWageList(wages){
  $('wage-list').innerHTML=wages.length
    ?wages.slice().reverse().map(w=>'<div class="wage-card">'+
        '<div class="wage-icon">'+(DEPT_ICONS[w.dept]||'')+'</div>'+
        '<div style="flex:1;min-width:0">'+
          '<div class="wage-date">'+fmtD(w.date)+'</div>'+
          '<div class="wage-dept"><span class="badge '+(DEPT_CLS[w.dept]||'bgr')+'">'+w.dept+'</span></div>'+
          (w.note?'<div class="wage-note">'+w.note+'</div>':'')+
        '</div>'+
        '<div style="text-align:right">'+
          '<div class="wage-amount">'+fmt(w.amount)+'</div>'+
          '<div class="wage-qty" style="font-family:\'IBM Plex Mono\',monospace">'+fmt(w.qty,2)+' × '+fmt(w.rate,0)+'</div>'+
        '</div></div>'
      ).join('')
    :'<div class="empty"><span class="empty-icon">🔍</span><p>ไม่พบรายการค่าแรง</p></div>';
}
